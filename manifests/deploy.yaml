apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deploy
  namespace: bank-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blood-app
  template:
    metadata:
      labels:
        app: blood-app
    spec:
      containers:
      - name: cont1
        image: 967848863323.dkr.ecr.us-east-1.amazonaws.com/blood-app:2
        ports:
        - containerPort: 80
        envFrom:
          - configMapRef:
              name:  cm1
        resources:
          limits:
            memory: "250Mi"
            cpu: "700m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 40
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
          
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 40
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3